name: 每日自动采集书源

on:
  schedule:
    # 主跑：UTC 17:07 = 北京次日 01:07（避开整点排队，也不影响白天使用）
    - cron: '7 17 * * *'
    # 补偿跑：UTC 21:07 = 北京次日 05:07。GitHub 免费 runner 排队满载时会直接丢弃
    # 定时任务且不留记录（2026-11-09 实测丢过一次），双 cron + 幂等守卫用来补这一天
    - cron: '7 21 * * *'
  workflow_dispatch:       # 手动触发
    inputs:
      months:
        description: '采集最近N个月'
        required: false
        default: '1'
      mode:
        description: 'test=跨洋连通性验证(列表10页+合集3个)；full=完整采集+清洗（不进正式版）'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - full

# 仓库级默认 GITHUB_TOKEN 是只读，必须在这里声明写权限，否则 git push 必然失败
permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 跨洋慢速采集需要更长上限

    # 跨洋优化：加大单请求超时+失败重试，用并发下载抵消慢速
    env:
      YCKCEO_TIMEOUT: '30'
      YCKCEO_RETRY: '3'
      YCKCEO_CONCURRENCY: '20'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 今天是否已采过（双 cron 幂等守卫）
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          LAST=$(tail -1 weekly/daily_history.jsonl 2>/dev/null | python3 -c "import sys,json;print(json.loads(sys.stdin.read()).get('date',''))" 2>/dev/null || true)
          echo "今天(北京)=$TODAY 上次采集=$LAST"
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已采过，本次跳过（补偿 cron 命中即说明主跑被丢，会继续执行）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 连通性诊断（跨洋到 yckceo 实测延迟）
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "=== 1. yckceo主站(列表页, 跨洋慢) ==="
          curl -s -o /dev/null -w "  耗时 %{time_total}s | HTTP %{http_code}\n" -A "Mozilla/5.0" --max-time 60 "https://www.yckceo.com/yuedu/shuyuan/index.html?page=1" || echo "  主站超时/拒连"
          echo "=== 2. 列表JSON直链(主站) ==="
          curl -s -o /dev/null -w "  耗时 %{time_total}s | HTTP %{http_code}\n" -A "Mozilla/5.0" --max-time 60 "https://www.yckceo.com/yuedu/shuyuan/json/id/7036.json" || echo "  列表JSON超时/拒连"
          echo "=== 3. 合集JSON(jsdelivr CDN, 海外快) ==="
          curl -sL -o /dev/null -w "  耗时 %{time_total}s | HTTP %{http_code}\n" -A "Mozilla/5.0" --max-time 30 "https://www.yckceo.com/yuedu/shuyuans/json/id/1330.json" || echo "  CDN超时"
          echo "=== 4. 大佬仓库直链 ==="
          curl -s -o /dev/null -w "  耗时 %{time_total}s | HTTP %{http_code}\n" -A "Mozilla/5.0" --max-time 30 "https://raw.githubusercontent.com/shidahuilang/shuyuan/gh-pages/legado3.json" || echo "  github raw 超时"

      - name: 运行采集（定时任务默认 full）
        id: collect
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MONTHS: ${{ inputs.months }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 定时触发默认 full（每天完整采集），手动触发按所选 mode
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE";
          elif [ "$EVENT_NAME" = "schedule" ]; then MODE=full;
          else MODE=test; fi
          MONTHS="${INPUT_MONTHS:-1}"
          echo "mode=$MODE months=$MONTHS"

          if [ "$MODE" = "full" ]; then
            echo "=== full: 采集(列表全量+合集) + 清洗 → weekly/cleaned_<ts>.json ==="
            echo "（本段不做任何存活/解析校验：跨洋校验误杀严重，校验与并入由本地国内网络完成）"
            python3 autocollect.py --collect-only --months "$MONTHS"
          else
            echo "=== test: 跨洋小规模验证（列表前10页 + 合集前3个 + 大佬仓库） ==="
            python3 scripts/collect_staged.py list --months "$MONTHS"
            python3 scripts/collect_staged.py heji 1 1 --months "$MONTHS" --limit 3
            python3 scripts/collect_staged.py gurus
          fi

      - name: 输出采集结果
        if: always()
        run: |
          echo "=== raw 分片统计 ==="
          python3 - <<'EOF'
          import json, glob, os
          total = 0
          for f in sorted(glob.glob("raw/autocollect/heji/*.json")):
              try:
                  n = len(json.load(open(f, encoding="utf-8")))
                  total += n
              except Exception:
                  pass
          print(f"  合集分片合计: {total}")
          EOF
          echo "=== weekly/cleaned 统计 ==="
          python3 - <<'EOF'
          import json, glob, os
          for f in sorted(glob.glob("weekly/cleaned_*.json")):
              try:
                  n = len(json.load(open(f, encoding="utf-8")))
                  print(f"  {os.path.basename(f)}: {n} 个清洗后源")
              except Exception as e:
                  print(f"  {os.path.basename(f)}: 读取失败 {e}")
          EOF
          echo "=== 采集脚本退出码: ${{ steps.collect.outcome }} ==="

      - name: 当天增量并入中间层（只新增，不复活已淘汰源）
        if: steps.guard.outputs.skip != 'true' && steps.collect.outcome == 'success'
        run: |
          CLEANED=$(ls -t weekly/cleaned_*.json 2>/dev/null | head -1)
          if [ -z "$CLEANED" ]; then
            echo "没有 cleaned 产物，跳过增量入库"
            exit 0
          fi
          echo "增量入库基准: $CLEANED"
          # 只取正式版与中间层都没有的 URL；存活校验 quick（403/405 WAF 保留，只淘汰 404/410 与域名不存在的死站）
          python3 scripts/stage_daily.py --cleaned "$CLEANED"

      - name: 上传清洗产物为 artifact（仓库不存大文件，避免历史膨胀）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-${{ github.run_number }}
          path: |
            weekly/cleaned_*.json
          retention-days: 35  # 保留 35 天，供每月合并汇总
          if-no-files-found: ignore

      - name: 写每日摘要并提交（小文件，进仓库便于查看趋势）
        if: always()
        run: |
          set +e
          python3 - <<'EOF'
          import json, glob, os, datetime
          fs = sorted(glob.glob("weekly/cleaned_*.json"))
          if not fs:
              print("没有 cleaned 产物，跳过摘要")
              raise SystemExit(0)
          f = fs[-1]
          data = json.load(open(f, encoding="utf-8"))
          from collections import Counter
          groups = Counter((s.get("bookSourceGroup") or "未分组") for s in data)
          domains = Counter()
          for s in data:
              u = s.get("bookSourceUrl") or ""
              try:
                  domains[u.split("//")[1].split("/")[0]] += 1
              except Exception:
                  pass
          summary = {
              # 北京时间（runner 是 UTC，直接用 now() 会差一天）
              "date": datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d"),
              "file": os.path.basename(f),
              "cleaned": len(data),
              "groups": dict(groups),
              "domains": len(domains),
          }
          os.makedirs("weekly", exist_ok=True)
          json.dump(summary, open("weekly/daily_summary.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=2)
          # 追加一行历史（便于看每天的清洗量变化）
          hist_path = "weekly/daily_history.jsonl"
          with open(hist_path, "a", encoding="utf-8") as fh:
              fh.write(json.dumps({"date": summary["date"], "cleaned": summary["cleaned"],
                                   "domains": summary["domains"]}, ensure_ascii=False) + "\n")
          # 历史行只保留最近 120 天
          lines = open(hist_path, encoding="utf-8").read().strip().split("\n")
          if len(lines) > 120:
              open(hist_path, "w", encoding="utf-8").write("\n".join(lines[-120:]) + "\n")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          EOF

          git add weekly/daily_summary.json weekly/daily_history.jsonl books_pending.json 2>/dev/null
          if git diff --staged --quiet; then
            echo "摘要无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 每日采集摘要+中间层增量 $(TZ=Asia/Shanghai date +%Y-%m-%d) [skip ci]"
          git push
