name: 自动采集更新书源

on:
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨2点自动跑
  workflow_dispatch:       # 也可以手动点按钮触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 最多跑60分钟，防止卡死
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 运行全自动采集脚本
        run: python3 autocollect.py --months 1

      - name: 生成Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: books.json
          body_path: collect_report.md

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books.json collect_report.md autocollect.log
          git diff --staged --quiet || git commit -m "chore: 每周自动采集更新 $(date +%Y-%m-%d)"
          git push
